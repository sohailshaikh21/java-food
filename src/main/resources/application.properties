spring.application.name=foodie-backend
server.port=${PORT:8080}

# Cloud & Local Datasource Configuration
# Supports Render, Railway, MySQL add-ons, or local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/foodie_db?connectionTimeZone=LOCAL&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:Sohail77@}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically initialize database tables if they do not exist
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Admin account setup
foodie.admin.email=${ADMIN_EMAIL:admin@foodies.com}
